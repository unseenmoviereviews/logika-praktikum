<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="description" content="Практическое занятие по логике: закон тождества и закон непротиворечия. Пародийный нуар.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Дело № 9-28 — определённость и непротиворечивость</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* бумага и типографская краска */
  --paper:#EEEBE4; --paper2:#FFFFFF; --ink:#111111; --ink2:#3A3A3A; --dim:#6B6B6B; --faint:#8E8E8E;
  --rule:#D5D1C8; --rule2:#B9B4A8;
  /* ночная сторона */
  --night:#0B0B0B; --night2:#151515; --night-line:#2C2C2C; --night-ink:#F3F3F3;
  /* акценты: смысл, а не украшение */
  --red:#D4121E; --red-ink:#FFFFFF;
  --yellow:#F2C200; --yellow-ink:#141414;
  --cyan:#0E97A6; --cyan-ink:#FFFFFF;
  --shadow:0 2px 0 rgba(0,0,0,.08), 0 12px 26px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 "Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.grain{position:fixed;inset:0;z-index:90;pointer-events:none;background-repeat:repeat;background-size:96px 96px;
  opacity:.10;mix-blend-mode:multiply}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,.ttl,.num,.grade-n,.stamp,.kind,.k,.grade-w,.tabs button,.btn,.rule b{
  font-family:"Oswald","Haettenschweiler","Arial Narrow",Impact,sans-serif;font-weight:500}
h1{font-size:30px;line-height:1.08;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
h2{font-size:21px;line-height:1.2;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em}
h3{font-size:16px;margin:0;letter-spacing:.03em}
p{margin:0 0 10px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.dim{color:var(--dim)}
.small{font-size:13px;line-height:1.45}
.mono{font-variant-numeric:tabular-nums}

/* ---------- титр ---------- */
.cover{position:relative;min-height:78vh;min-height:78svh;display:flex;flex-direction:column;justify-content:flex-end;
  background-size:cover;background-position:50% 40%;padding:0 0 26px;background-color:#000}
.cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.25) 28%,rgba(0,0,0,.82) 70%,#000 100%)}
.cover .wrap{position:relative;z-index:1}
.stamp{display:inline-block;background:var(--red);color:var(--red-ink);padding:5px 11px;
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:14px}
.cover h1{font-size:42px;letter-spacing:.04em;color:#fff;text-shadow:0 2px 26px rgba(0,0,0,.9)}
.cover h1 em{font-style:normal;color:var(--red)}
.cover .sub{color:var(--yellow);font-size:12px;letter-spacing:.26em;text-transform:uppercase;margin:4px 0 14px}
.cover .dim{color:#C9C9C9}
.start{background:var(--night);color:var(--night-ink);padding:18px 0 30px;margin-top:-1px}
.start .field span{color:#9A9A9A}
.start .field input{background:#1A1A1A;border-color:#333;color:#fff}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--night);color:var(--night-ink);
  border-bottom:3px solid var(--red);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.top .ttl{font-size:14px;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap}
.meters{display:flex;gap:6px;font-size:11px;overflow-x:auto;scrollbar-width:none}
.meters::-webkit-scrollbar{display:none}
.meter{border:1px solid #3A3A3A;padding:3px 8px;color:#B5B5B5;white-space:nowrap;flex:0 0 auto;letter-spacing:.04em}
.meter b{color:#fff;font-weight:600}
.meter.m-red b{color:var(--red)} .meter.m-yel b{color:var(--yellow)} .meter.m-cyan b{color:#53D7E2}

/* ---------- вкладки ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--night);
  border-top:1px solid #272727;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{position:relative;flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#8A8A8A;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:#fff}
.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;width:38px;height:3px;background:var(--red);transform:translateX(-50%)}
.tabs .badge{position:absolute;top:8px;right:50%;transform:translateX(26px);background:var(--yellow);color:var(--yellow-ink);
  font-size:10px;font-weight:700;padding:0 5px;line-height:1.5}

/* ---------- блоки ---------- */
.sec{padding:16px 0 6px}
.card{background:var(--paper2);border:1px solid var(--rule);padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.rule{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.rule:first-child{border-top:0}
.rule b{white-space:nowrap;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.rule:nth-child(1) b{color:var(--red)} .rule:nth-child(2) b{color:var(--ink2)}
.rule:nth-child(3) b{color:#A98700} .rule:nth-child(4) b{color:var(--cyan)}
.hint{color:var(--dim);font-size:13px}

/* ---------- свидетели ---------- */
.people{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 12px;margin:0 -14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:0 0 auto;width:112px;border:1px solid var(--rule2);background:var(--paper2);text-align:left;overflow:hidden;filter:saturate(.25);opacity:.85}
.person .pic{height:72px;background-size:cover;background-position:50% 40%}
.person .nm{padding:7px 8px 8px}
.person .nm b{display:block;font-size:13.5px}
.person .nm span{display:block;font-size:11px;color:var(--dim);line-height:1.25;margin-top:2px}
.person[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);filter:none;opacity:1}

/* ---------- реплики ---------- */
.lines{padding-bottom:10px}
.line{position:relative;background:var(--paper2);border:1px solid var(--rule);border-left:4px solid var(--rule2);
  padding:12px;margin:0 0 9px;width:100%;text-align:left;display:block;line-height:1.5;color:var(--ink)}
.line .num{color:var(--faint);font-size:11px;letter-spacing:.14em;margin-right:7px;font-weight:600}
.line.sel{border-color:var(--red);border-left-color:var(--red);background:#FFF4F4;box-shadow:0 0 0 2px rgba(212,18,30,.25)}
.line.used{border-left-color:var(--red)}
.line .tag{display:inline-block;margin:8px 6px 0 0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;
  background:var(--red);color:var(--red-ink)}
.line .tag.t-yel{background:var(--yellow);color:var(--yellow-ink)}
.line .tag.t-cyan{background:var(--cyan);color:var(--cyan-ink)}
.line.inf{background:var(--night);color:var(--night-ink);border-color:#000;border-left-color:var(--cyan)}
.line.inf .num{color:#7A7A7A}
.line.inf .who{display:block;font-size:10.5px;color:#53D7E2;letter-spacing:.18em;text-transform:uppercase;margin-bottom:5px}
.doc{background:var(--night);color:var(--night-ink);padding:12px;margin:0 0 9px;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.doc .pic{flex:0 0 60px;height:60px;background-size:cover;background-position:center}
.doc .num{color:var(--yellow);font-size:11px;letter-spacing:.14em;font-weight:600}

/* ---------- режим связывания ---------- */
.banner{position:sticky;top:52px;z-index:20;background:var(--red);color:var(--red-ink);
  padding:11px 12px;margin:8px 0 10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{font-weight:700;text-decoration:underline;text-transform:uppercase;font-size:12px;letter-spacing:.08em}

/* ---------- модалка ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet-in{width:100%;max-width:640px;background:var(--paper2);border-top:4px solid var(--red);
  padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:86vh;max-height:86svh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h3{margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--rule2);padding:12px;
  margin:0 0 8px;min-height:48px;line-height:1.4;background:var(--paper)}
.opt[aria-pressed="true"]{border-color:var(--red);background:#FFF1F1;box-shadow:inset 4px 0 0 var(--red);font-weight:600}

/* ---------- блокнот ---------- */
.note{background:var(--paper2);border:1px solid var(--rule);border-left:4px solid var(--red);padding:11px 12px;margin:0 0 9px}
.note.n-yel{border-left-color:var(--yellow)} .note.n-cyan{border-left-color:var(--cyan)}
.note .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.note .kind{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.note.n-yel .kind{color:#A98700} .note.n-cyan .kind{color:var(--cyan)}
.note .del{color:var(--dim);font-size:12px;text-decoration:underline;white-space:nowrap}
.note q{display:block;color:var(--ink2);font-size:13.5px;margin-top:5px;line-height:1.45}
.empty{color:var(--dim);text-align:center;padding:28px 10px;line-height:1.7}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
  background:var(--red);color:var(--red-ink);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:12px 16px}
.btn.sec2{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.45}
.stack{display:grid;gap:10px;margin:14px 0 26px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:.16em;text-transform:uppercase}
.field input{width:100%;min-height:50px;padding:13px;border:1px solid var(--rule2);background:var(--paper2)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:4px 0;font-weight:600}

/* ---------- итог ---------- */
.result{text-align:center;padding:26px 14px 16px;background:var(--night);color:var(--night-ink);margin-bottom:14px}
.grade-n{font-size:112px;line-height:.9;color:var(--red);text-shadow:0 0 44px rgba(212,18,30,.35)}
.grade-5 .grade-n{color:var(--yellow);text-shadow:0 0 44px rgba(242,194,0,.3)}
.grade-w{font-size:12px;text-transform:uppercase;letter-spacing:.34em;color:#B9B9B9;margin-top:8px}
.bars{margin:20px 0 0}
.bar{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #2A2A2A;font-size:14px;text-align:left}
.bar b{white-space:nowrap;font-variant-numeric:tabular-nums}
.plus{color:var(--yellow)} .minus{color:var(--red)}
.rv{border-top:1px solid var(--rule);padding:12px 0}
.rv .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#0E7A2E}
.rv .k::before{content:"✓ "}
.rv.miss .k{color:#A98700} .rv.miss .k::before{content:"— "}
.rv.wrong .k{color:var(--red)} .rv.wrong .k::before{content:"✗ "}
.rv q{display:block;color:var(--ink2);font-size:13.5px;margin:5px 0;line-height:1.45}
.rv.wrong q{text-decoration:line-through;text-decoration-color:var(--rule2)}
@media (prefers-reduced-motion:no-preference){
  .line,.opt,.person{transition:border-color .15s,background-color .15s,box-shadow .15s,opacity .15s,filter .15s}
}

    (L.inf ? '<span class="who">Лейтенант Доннелли</span>' : '') +
    '<span class="num">' + id.toUpperCase() + '</span>' + esc(L.t) +
    tags.map(function (t) { return '<span class="tag' + t.c + '">' + esc(t.t) + '</span>'; }).join("") +
    '</button>';
}

function screenLines() {
  var people = WITNESSES.map(function (w, i) {
    return '<button class="person" data-act="person" data-i="' + i + '" aria-current="' + (ui.person === i) + '">' +
      '<span class="pic ' + w.photo + '"></span><span class="nm"><b>' + esc(w.name) + '</b><span>' + esc(w.role) + '</span></span></button>';
  }).join("") +
    '<button class="person" data-act="person" data-i="4" aria-current="' + (ui.person === 4) + '">' +
      '<span class="pic ph-letter"></span><span class="nm"><b>Материалы</b><span>протоколы и записи</span></span></button>' +
    '<button class="person" data-act="person" data-i="5" aria-current="' + (ui.person === 5) + '">' +
      '<span class="pic ph-blinds"></span><span class="nm"><b>Версии</b><span>выводы следователя</span></span></button>';

  var body = "";
  if (ui.person < 4) {
    var w = WITNESSES[ui.person];
    body = '<h2>' + esc(w.name) + '</h2><p class="small dim">' + esc(w.role) + ". " + esc(w.note) + '</p>' +
      '<div class="lines">' + w.lines.map(function (l) { return lineHTML(l.id); }).join("") + '</div>';
  } else if (ui.person === 4) {
    body = '<h2>Материалы дела</h2><p class="small dim">Документы не врут. Правда, и не договаривают.</p>' +
      '<div class="lines">' + DOCS.map(function (d) {
        return '<div class="doc">' + (d.photo ? '<span class="pic ' + d.photo + '"></span>' : '') +
          '<span><span class="num">' + d.id.toUpperCase() + '</span> ' + esc(d.t) + '</span></div>';
      }).join("") + '</div>';
  } else {
    body = '<h2>Версии следствия</h2><p class="small dim">Доннелли думает вслух и не всегда попадает. Но не всё, что он говорит, — мимо.</p>' +
      '<div class="lines">' + INFERENCES.map(function (r) { return lineHTML(r.id, "inf"); }).join("") + '</div>';
  }

  var banner = ui.pending
    ? '<div class="banner wrap">Теперь ткните во вторую реплику<button data-act="cancelPair">отмена</button></div>' : "";
  return '<div class="wrap"><div class="people">' + people + '</div></div>' + banner +
    '<main class="wrap sec" style="padding-top:4px">' + body + '</main>';
}

function screenNotes() {
  var items = [];
  S.pairs.forEach(function (p, i) {
    var ids = p.k.split("|");
    items.push('<div class="note"><div class="hd"><span class="kind">Противоречие</span>' +
      '<button class="del" data-act="del" data-t="pairs" data-i="' + i + '">удалить</button></div>' +
      '<q>' + ids[0].toUpperCase() + ". " + esc(ALL_LINES[ids[0]].t) + '</q>' +
      '<q>' + ids[1].toUpperCase() + ". " + esc(ALL_LINES[ids[1]].t) + '</q></div>');
  });
  S.marks.forEach(function (m, i) {
    items.push('<div class="note n-yel"><div class="hd"><span class="kind">Подмена слова: ' + esc(m.word) + '</span>' +
      '<button class="del" data-act="del" data-t="marks" data-i="' + i + '">удалить</button></div>' +
      '<q>' + m.id.toUpperCase() + ". " + esc(ALL_LINES[m.id].t) + '</q></div>');
  });
  S.infers.forEach(function (x, i) {
    var r = ALL_LINES[x.id].inf;
    items.push('<div class="note n-cyan"><div class="hd"><span class="kind">Вывод не следует</span>' +
      '<button class="del" data-act="del" data-t="infers" data-i="' + i + '">удалить</button></div>' +
      '<q>' + x.id.toUpperCase() + ". " + esc(r.t) + '</q>' +
      '<q>Основание: ' + esc(r.opts[x.a] || "—") + '</q></div>');
  });
  return '<main class="wrap sec"><h2>Блокнот</h2>' +
    (items.length ? items.join("") : '<div class="empty">Блокнот пуст, как бар после закрытия.<br>Идите к показаниям и найдите первую нестыковку.</div>') +
    '<div class="stack"><button class="btn sec2" data-act="screen" data-s="lines">К показаниям</button>' +
    '<button class="btn" data-act="screen" data-s="final">Перейти к выводам</button></div></main>';
}

function screenFinal() {
  var qs = FINAL.map(function (q, i) {
    var a = S.final[q.id];
    var opts = q.opts.map(function (o, k) {
      var on = q.multi ? (a || []).indexOf(k) >= 0 : a === k;
      return '<button class="opt" data-act="fin" data-q="' + q.id + '" data-k="' + k + '" aria-pressed="' + on + '">' + esc(o) + '</button>';
    }).join("");
    return '<div class="card"><h3>' + (i + 1) + ". " + esc(q.q) + '</h3>' +
      (q.multi ? '<p class="hint">Выберите две.</p>' : "") + opts + '</div>';
  }).join("");
  var left = FINAL.filter(function (q) {
    var a = S.final[q.id];
    return q.multi ? !(a && a.length === q.multi) : a == null;
  }).length;
  var found = S.pairs.length + S.marks.length + S.infers.length;
  return '<main class="wrap sec"><h2>Выводы по делу</h2>' +
    '<p class="small dim">В блокноте записей: ' + found + '. Ответьте на четыре вопроса и сдайте работу.</p>' + qs +
    (ui.confirm
      ? '<div class="card" style="border-color:var(--amber)"><p><b>Сдать работу?</b> После этого изменить ответы нельзя.' +
        (left ? ' Без ответа вопросов: ' + left + '.' : '') + '</p>' +
        '<div class="stack" style="margin:10px 0 0"><button class="btn" data-act="submit2">Да, сдать</button>' +
        '<button class="btn sec2" data-act="nosubmit">Вернуться</button></div></div>'
      : '<div class="stack"><button class="btn" data-act="submit">Сдать работу</button></div>') +
    '</main>';
}

/* ---------- модалки ---------- */
function sheetHTML() {
  var s = ui.sheet, h = "";
  if (s.type === "acts") {
    var L = ALL_LINES[s.id];
    h = '<h3>' + s.id.toUpperCase() + '</h3><p class="small dim">' + esc(L.t) + '</p>' +
      (L.inf
        ? '<button class="opt" data-act="startInfer" data-id="' + s.id + '">Вывод не следует из посылок</button>'
        : '<button class="opt" data-act="startPair" data-id="' + s.id + '">Связать с другой репликой (противоречие)</button>' +
          '<button class="opt" data-act="startMark" data-id="' + s.id + '">Здесь подмена слова</button>') +
      '<button class="btn sec2" data-act="closeSheet">Отмена</button>';
  }
  if (s.type === "mark") {
    var L2 = ALL_LINES[s.id];
    var words = L2.words || guessWords(L2.t);
    h = '<h3>Какое слово поменяло значение?</h3><p class="small dim">' + esc(L2.t) + '</p>' +
      words.map(function (w) { return '<button class="opt" data-act="markWord" data-id="' + s.id + '" data-w="' + esc(w) + '">' + esc(w) + '</button>'; }).join("") +
      '<button class="btn sec2" data-act="closeSheet">Отмена</button>';
  }
  if (s.type === "infer") {
    var r = ALL_LINES[s.id].inf;
    var opts = r.opts.length ? r.opts : ["Вывод не следует из посылок", "Посылка ложна", "Вывод верен", "Не хватает данных"];
    h = '<h3>Чего не хватает этому выводу?</h3><p class="small dim">' + esc(r.t) + '</p>' +
      opts.map(function (o, k) { return '<button class="opt" data-act="inferWhy" data-id="' + s.id + '" data-k="' + k + '">' + esc(o) + '</button>'; }).join("") +
      '<button class="btn sec2" data-act="closeSheet">Отмена</button>';
  }
  if (s.type === "msg") h = '<h3>' + esc(s.title) + '</h3><p class="small dim">' + esc(s.text) + '</p><button class="btn" data-act="closeSheet">Понятно</button>';
  return '<div class="sheet" data-act="closeSheet"><div class="sheet-in" data-stop="1">' + h + '</div></div>';
}
function guessWords(t) {
  var w = t.replace(/[.,:;«»—()]/g, " ").split(/\s+/).filter(function (x) { return x.length > 4; });
  return w.slice(0, 4);
}
function msg(title, text) { ui.sheet = { type: "msg", title: title, text: text }; }

/* ---------- старт и результат ---------- */
function renderStart() {
  app.innerHTML =
    '<section class="cover ph-alley"><div class="wrap">' +
      '<span class="stamp">Дело № 9-28 · совершенно секретно</span>' +
      '<h1>Ночь в отеле <em>«Рузвельт»</em></h1>' +
      '<p class="sub">' + esc(CASE.sub) + '</p>' +
      '<p class="dim">Практическое занятие. Определённость и непротиворечивость: закон тождества и закон непротиворечия. ' + MINUTES + ' минут.</p>' +
    '</div></section>' +
    '<section class="start"><main class="wrap">' +
      '<label class="field"><span>Фамилия и имя</span><input id="fName" autocomplete="name" value="' + esc(draft.name) + '"></label>' +
      '<label class="field"><span>Группа</span><input id="fGroup" value="' + esc(draft.group) + '"></label>' +
      '<p class="err">' + esc(draft.err) + '</p>' +
      '<div class="stack"><button class="btn" data-act="start">Принять дело</button></div>' +
    '</main></section>';
  var n = document.getElementById("fName"), g = document.getElementById("fGroup");
  n.addEventListener("input", function () { draft.name = n.value; });
  g.addEventListener("input", function () { draft.group = g.value; });
}

function renderResult() {
  var T = totals(), d = new Date(S.submittedAt);
  var head = '<header class="top"><div class="wrap"><div class="top-in"><span class="ttl">Дело № 9-28</span>' +
    '<span class="meters"><span class="meter">' + esc(S.name) + '</span></span></div></div></header>';
  var res = '<section class="result' + (T.mark === 5 ? ' grade-5' : '') + '">' +
    '<div class="grade-n">' + T.mark + '</div><div class="grade-w">' + MARK_WORDS[T.mark] + '</div>' +
    '<p class="dim small" style="margin-top:10px">' + T.raw + ' из ' + T.max + ' баллов · ' + T.pct + '% · ' + minutes() + ' мин</p>' +
    '<div class="bars">' +
      bar("Противоречия", T.parts.pairs, PAIRS.length * SCORE.pair) +
      bar("Подмены слов", T.parts.marks, Object.keys(MARK_LINES).length * 2) +
      bar("Выводы следствия", T.parts.infers, 6) +
      bar("Ответы по делу", T.parts.final, FINAL.reduce(function (n, q) { return n + q.pts; }, 0)) +
    '</div>' +
    '<p class="hint" style="margin-top:14px">' + esc(S.name) + (S.group ? ", группа " + esc(S.group) : "") +
    '. Сдано ' + d.toLocaleDateString("ru-RU") + " в " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) + '</p>' +
    '</section>';
  var tail;
  if (!S.revealed) {
    tail = '<main class="wrap"><p class="small dim">Разбор дела открывает преподаватель. Без него — только совесть.</p>' +
      '<label class="field"><span>Пароль преподавателя</span><input id="pw" type="password" autocomplete="off"></label>' +
      '<p class="err">' + esc(ui.pwErr) + '</p>' +
      '<div class="stack"><button class="btn" data-act="unlock">Показать разбор</button></div></main>';
  } else {
    tail = '<main class="wrap sec">' + review() +
      (ui.reset
        ? '<div class="card" style="border-color:var(--amber)"><p><b>Начать заново?</b> Результат и блокнот будут удалены с этого телефона.</p>' +
          '<div class="stack" style="margin:10px 0 0"><button class="btn" data-act="reset2">Да, начать заново</button>' +
          '<button class="btn sec2" data-act="noreset">Отмена</button></div></div>'
        : '<div class="stack"><button class="btn sec2" data-act="reset">Начать заново</button></div>') + '</main>';
  }
  app.innerHTML = head + res + tail;
}
function bar(name, got, max) {
  var cls = got < 0 ? "minus" : got > 0 ? "plus" : "";
  return '<div class="bar"><span>' + name + '</span><b class="' + cls + '">' + got + " / " + max + '</b></div>';
}

function review() {
  var h = '<h2>Разбор дела</h2>';
  h += '<h3 style="margin:14px 0 6px">Противоречия</h3>';
  var foundKeys = {};
  S.pairs.forEach(function (p) {
    foundKeys[p.k] = 1;
    var v = pairVerdict(p.k), ids = p.k.split("|");
    h += '<div class="rv ' + (v.v === "ok" ? "" : "wrong") + '"><span class="k">' +
      (v.v === "ok" ? "верно, +2" : v.v === "trap" ? "мнимое противоречие, −1" : "не противоречие, −1") + '</span>' +
      '<q>' + ids[0].toUpperCase() + ". " + esc(ALL_LINES[ids[0]].t) + '</q>' +
      '<q>' + ids[1].toUpperCase() + ". " + esc(ALL_LINES[ids[1]].t) + '</q>' +
      '<p class="small">' + esc(v.why) + '</p></div>';
  });
  PAIRS.forEach(function (p) {
    if (foundKeys[p.k]) return;
    var ids = p.k.split("|");
    h += '<div class="rv miss"><span class="k">пропущено</span>' +
      '<q>' + ids[0].toUpperCase() + ". " + esc(ALL_LINES[ids[0]].t) + '</q>' +
      '<q>' + ids[1].toUpperCase() + ". " + esc(ALL_LINES[ids[1]].t) + '</q>' +
      '<p class="small">' + esc(p.why) + '</p></div>';
  });

  h += '<h3 style="margin:18px 0 6px">Подмены слов</h3>';
  var foundMarks = {};
  S.marks.forEach(function (m) {
    var v = markVerdict(m); foundMarks[m.id] = 1;
    h += '<div class="rv ' + (v.v === "ok" ? "" : v.v === "half" ? "miss" : "wrong") + '"><span class="k">' +
      (v.v === "ok" ? "верно, +2" : v.v === "half" ? "частично, +1" : "мимо, −1") + '</span>' +
      '<q>' + m.id.toUpperCase() + ". " + esc(ALL_LINES[m.id].t) + '</q>' +
      '<p class="small">Ваш ответ: «' + esc(m.word) + '». ' + esc(v.why) + '</p></div>';
  });
  Object.keys(MARK_LINES).forEach(function (id) {
    if (foundMarks[id]) return;
    h += '<div class="rv miss"><span class="k">пропущено</span><q>' + id.toUpperCase() + ". " + esc(ALL_LINES[id].t) + '</q>' +
      '<p class="small">Подмена держится на слове «' + esc(ALL_LINES[id].word) + '».</p></div>';
  });

  h += '<h3 style="margin:18px 0 6px">Выводы следствия</h3>';
  var foundInf = {};
  S.infers.forEach(function (x) {
    var v = inferVerdict(x); foundInf[x.id] = 1;
    h += '<div class="rv ' + (v.v === "ok" ? "" : v.v === "half" ? "miss" : "wrong") + '"><span class="k">' +
      (v.v === "ok" ? "верно, +2" : v.v === "half" ? "частично, +1" : "вывод корректен, −1") + '</span>' +
      '<q>' + x.id.toUpperCase() + ". " + esc(ALL_LINES[x.id].t) + '</q>' +
      '<p class="small">' + esc(v.why) + '</p></div>';
  });
  INFERENCES.forEach(function (r) {
    if (!r.bad || foundInf[r.id]) return;
    h += '<div class="rv miss"><span class="k">пропущено</span><q>' + r.id.toUpperCase() + ". " + esc(r.t) + '</q>' +
      '<p class="small">' + esc(r.why) + '</p></div>';
  });

  h += '<h3 style="margin:18px 0 6px">Ответы по делу</h3>';
  FINAL.forEach(function (q) {
    var a = S.final[q.id], pts = finalPts(q);
    var mine = a == null ? "нет ответа" : q.multi ? a.map(function (k) { return q.opts[k]; }).join("; ") : q.opts[a];
    var right = q.multi ? q.a.map(function (k) { return q.opts[k]; }).join("; ") : q.opts[q.a];
    h += '<div class="rv ' + (pts ? "" : "wrong") + '"><span class="k">' + (pts ? "верно, +" + pts : "неверно") + '</span>' +
      '<p class="small"><b>' + esc(q.q) + '</b></p><q>Ваш ответ: ' + esc(mine) + '</q>' +
      (pts ? "" : '<q>Верно: ' + esc(right) + '</q>') + '<p class="small">' + esc(q.why) + '</p></div>';
  });
  return h;
}

/* ---------- действия ---------- */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.dataset.act;
  // клик по подложке закрывает лист; клик внутри листа — нет
  if (act === "closeSheet" && el.classList.contains("sheet") && e.target.closest(".sheet-in")) return;
  if (act === "closeSheet") { ui.sheet = null; render(); return; }
  var top = false;

  if (act === "start") {
    if (!draft.name.trim()) { draft.err = "Введите фамилию и имя."; renderStart(); return; }
    S = fresh(draft.name.trim(), draft.group.trim()); top = true;
  } else if (!S) return;
  else if (act === "screen") { S.screen = el.dataset.s; ui.pending = null; top = true; }
  else if (act === "person") { ui.person = +el.dataset.i; top = true; }
  else if (act === "line") { ui.sheet = ui.pending ? null : { type: "acts", id: el.dataset.id };
    if (ui.pending) {
      var id = el.dataset.id;
      if (id === ui.pending) { ui.pending = null; }
      else {
        var k = pairKey(ui.pending, id);
        var dup = S.pairs.some(function (p) { return p.k === k; });
        ui.pending = null;
        if (dup) msg("Уже было", "Такая пара в блокноте уже лежит.");
        else if (S.pairs.length >= LIMITS.pairs) msg("Бланки кончились", "Связок больше нет. Удалите запись из блокнота — освободится попытка.");
        else { S.pairs.push({ k: k }); msg("Записал", "Пара в блокноте. Права она или нет — узнаете, когда сдадите дело."); }
      }
    }
  }
  else if (act === "startPair") { ui.sheet = null; ui.pending = el.dataset.id; }
  else if (act === "startMark") { ui.sheet = { type: "mark", id: el.dataset.id }; }
  else if (act === "startInfer") { ui.sheet = { type: "infer", id: el.dataset.id }; }
  else if (act === "markWord") {
    var mid = el.dataset.id, w = el.dataset.w;
    if (S.marks.some(function (m) { return m.id === mid; })) { ui.sheet = null; msg("Уже было", "Эту реплику вы уже отметили."); }
    else if (S.marks.length >= LIMITS.marks) { ui.sheet = null; msg("Бланки кончились", "Отметок подмены больше нет. Что-то придётся вычеркнуть."); }
    else { S.marks.push({ id: mid, word: w }); ui.sheet = null; msg("Записал", "Отметка легла в блокнот."); }
  }
  else if (act === "inferWhy") {
    var iid = el.dataset.id, k2 = +el.dataset.k;
    if (S.infers.some(function (x) { return x.id === iid; })) { ui.sheet = null; msg("Уже было", "Этот вывод уже отмечен."); }
    else if (S.infers.length >= LIMITS.infers) { ui.sheet = null; msg("Бланки кончились", "Отметок выводов больше нет. Что-то придётся вычеркнуть."); }
    else { S.infers.push({ id: iid, a: k2 }); ui.sheet = null; msg("Записал", "Отметка легла в блокнот."); }
  }
  else if (act === "cancelPair") ui.pending = null;
  else if (act === "del") { S[el.dataset.t].splice(+el.dataset.i, 1); }
  else if (act === "fin") {
    var q = FINAL.filter(function (x) { return x.id === el.dataset.q; })[0], kk = +el.dataset.k;
    if (q.multi) {
      var cur = S.final[q.id] || [];
      if (cur.indexOf(kk) >= 0) cur = cur.filter(function (x) { return x !== kk; });
      else { cur = cur.concat(kk); if (cur.length > q.multi) cur = cur.slice(1); }
      S.final[q.id] = cur;
    } else S.final[q.id] = kk;
  }
  else if (act === "submit") ui.confirm = true;
  else if (act === "nosubmit") ui.confirm = false;
  else if (act === "submit2") { S.submitted = true; S.submittedAt = Date.now(); ui.confirm = false; top = true; }
  else if (act === "unlock") {
    var v = (document.getElementById("pw") || {}).value || "";
    if (hashStr(v.trim().toLowerCase()) === PASS_HASH) { S.revealed = true; ui.pwErr = ""; top = true; }
    else ui.pwErr = "Неверный пароль.";
  }
  else if (act === "reset") ui.reset = true;
  else if (act === "noreset") ui.reset = false;
  else if (act === "reset2") { S = null; ui.reset = false; draft = { name: "", group: "", err: "" }; save(); render(); window.scrollTo(0, 0); return; }

  save(); render();
  if (top) window.scrollTo(0, 0);
});

setInterval(function () {
  var c = document.getElementById("clock");
  if (c && S && !S.submitted) c.textContent = minutes() + "/" + MINUTES;
}, 20000);

render();

</script>
</body>
</html>
